<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#060F1B"/>
      <stop offset="55%"  stop-color="#0F1F35"/>
      <stop offset="100%" stop-color="#133756"/>
    </linearGradient>
    <radialGradient id="glow1" cx="984" cy="0" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#14B8A6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#060F1B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="600" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060F1B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="markHL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#glow1)"/>
  <rect width="1200" height="600" fill="url(#glow2)"/>

  <!-- Kicker -->
  <rect x="80" y="116" width="10" height="10" rx="5" fill="#14B8A6"/>
  <text x="100" y="126" font-family="'Courier New', monospace" font-weight="600" font-size="13" fill="#5EEAD4" letter-spacing="2">PLATAFORMA INTEGRADA · SAÚDE PÚBLICA</text>

  <!-- VALENS -->
  <text x="78" y="248" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="88" fill="#FFFFFF" letter-spacing="-2">VALENS</text>

  <!-- Subtitle -->
  <text x="80" y="310" font-family="Arial, sans-serif" font-weight="400" font-size="26" fill="rgba(255,255,255,0.70)">Prontuário · Agenda · Farmácia · Auditoria</text>
  <text x="80" y="348" font-family="Arial, sans-serif" font-weight="400" font-size="26" fill="rgba(255,255,255,0.70)">UBS · ESF · Secretarias municipais de saúde</text>

  <!-- Tags -->
  <rect x="80" y="392" width="112" height="32" rx="16" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.25)" stroke-width="1"/>
  <text x="120" y="413" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#5EEAD4" text-anchor="middle">LGPD</text>

  <rect x="206" y="392" width="112" height="32" rx="16" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.25)" stroke-width="1"/>
  <text x="262" y="413" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#5EEAD4" text-anchor="middle">e-SUS APS</text>

  <rect x="332" y="392" width="112" height="32" rx="16" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.25)" stroke-width="1"/>
  <text x="388" y="413" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#5EEAD4" text-anchor="middle">RNDS</text>

  <!-- Brand mark -->
  <g transform="translate(850, 170)">
    <rect width="188" height="188" rx="40" fill="url(#markGrad)"/>
    <rect width="188" height="188" rx="40" fill="url(#markHL)"/>
    <rect x="35"  y="35"  width="118" height="23" rx="9" fill="white"/>
    <rect x="130" y="35"  width="23"  height="71" rx="9" fill="white"/>
    <rect x="35"  y="82"  width="118" height="23" rx="9" fill="white"/>
    <rect x="35"  y="82"  width="23"  height="71" rx="9" fill="white"/>
    <rect x="35"  y="129" width="118" height="23" rx="9" fill="white"/>
  </g>

  <!-- Domain -->
  <text x="80" y="530" font-family="'Courier New', monospace" font-size="15" fill="rgba(255,255,255,0.35)" letter-spacing="1">landing-2f7.pages.dev</text>

  <rect x="0" y="592" width="1200" height="8" fill="url(#markGrad)"/>
</svg>
