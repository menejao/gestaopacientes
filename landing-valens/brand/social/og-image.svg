<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#060F1B"/>
      <stop offset="55%"  stop-color="#0F1F35"/>
      <stop offset="100%" stop-color="#133756"/>
    </linearGradient>
    <radialGradient id="glow1" cx="984" cy="0" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#14B8A6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#060F1B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="630" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#060F1B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="markHL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Left content -->
  <!-- Kicker -->
  <rect x="80" y="140" width="12" height="12" rx="6" fill="#14B8A6"/>
  <rect x="80" y="140" width="12" height="12" rx="6" fill="#14B8A6" opacity="0.4" transform="scale(1.8) translate(-2.2,-2.2)"/>
  <text x="102" y="152" font-family="'Courier New', monospace" font-weight="600" font-size="14" fill="#5EEAD4" letter-spacing="2">PLATAFORMA INTEGRADA</text>

  <!-- VALENS wordmark -->
  <text x="78" y="270" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" letter-spacing="-3">VALENS</text>

  <!-- Subtitle -->
  <text x="80" y="336" font-family="Arial, sans-serif" font-weight="400" font-size="28" fill="rgba(255,255,255,0.70)">Plataforma integrada para gestão</text>
  <text x="80" y="372" font-family="Arial, sans-serif" font-weight="400" font-size="28" fill="rgba(255,255,255,0.70)">da saúde pública municipal</text>

  <!-- Pills -->
  <rect x="80" y="418" width="158" height="34" rx="17" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.25)" stroke-width="1"/>
  <text x="113" y="440" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5EEAD4" letter-spacing="1">LGPD · e-SUS</text>
  <rect x="78" y="416" width="8" height="8" rx="4" fill="#14B8A6" transform="translate(8,5)"/>

  <rect x="252" y="418" width="146" height="34" rx="17" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.25)" stroke-width="1"/>
  <text x="273" y="440" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#5EEAD4" letter-spacing="1">APS · UBS · ESF</text>

  <!-- Right — brand mark scaled -->
  <g transform="translate(840, 200)">
    <rect width="200" height="200" rx="42" fill="url(#markGrad)"/>
    <rect width="200" height="200" rx="42" fill="url(#markHL)"/>
    <!-- white rectangles (original 32px base × 6.25) -->
    <rect x="37"  y="37"  width="125" height="25" rx="10" fill="white"/>
    <rect x="137" y="37"  width="25"  height="75" rx="10" fill="white"/>
    <rect x="37"  y="87"  width="125" height="25" rx="10" fill="white"/>
    <rect x="37"  y="87"  width="25"  height="75" rx="10" fill="white"/>
    <rect x="37"  y="137" width="125" height="25" rx="10" fill="white"/>
  </g>

  <!-- Domain -->
  <text x="80" y="560" font-family="'Courier New', monospace" font-size="16" fill="rgba(255,255,255,0.35)" letter-spacing="1">landing-2f7.pages.dev</text>

  <!-- Bottom border accent -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#markGrad)"/>
</svg>
