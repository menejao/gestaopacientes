name: Nightly Backup

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:

jobs:
  export-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Define timestamp
        id: stamp
        run: echo "ts=$(date -u +'%Y-%m-%dT%H-%M-%SZ')" >> "$GITHUB_OUTPUT"

      - name: Export backup from API
        env:
          BACKUP_EXPORT_URL: ${{ secrets.BACKUP_EXPORT_URL }}
          BACKUP_EXPORT_KEY: ${{ secrets.BACKUP_EXPORT_KEY }}
        run: |
          test -n "$BACKUP_EXPORT_URL"
          test -n "$BACKUP_EXPORT_KEY"
          mkdir -p backup-output
          curl -fsSL \
            -H "x-backup-key: $BACKUP_EXPORT_KEY" \
            "$BACKUP_EXPORT_URL/admin/backup/export" \
            -o "backup-output/backup-${{ steps.stamp.outputs.ts }}.json"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: saudeubs-backup-${{ steps.stamp.outputs.ts }}
          path: backup-output/*.json
          if-no-files-found: error
          retention-days: 30
